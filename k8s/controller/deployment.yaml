apiVersion: apps/v1
kind: Deployment
metadata:
  name: grantory-controller
  namespace: grantory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grantory-controller
  template:
    metadata:
      labels:
        app: grantory-controller
    spec:
      serviceAccountName: grantory-controller
      containers:
        - name: controller
          image: tasansga/grantory:latest
          args:
            - controller
          env:
            - name: GRANTORY_CONTROLLER_SERVER
              value: http://grantory.default.svc.cluster.local:8080
            - name: GRANTORY_CONTROLLER_NAMESPACE
              value: _def
            # Optional: automatically provision and use a cluster-wide host identity
            # - name: GRANTORY_CONTROLLER_AUTO_CREATE_HOST
            #   value: "true"
            # - name: GRANTORY_CONTROLLER_AUTO_HOST_NAME
            #   value: "k8s-cluster"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
